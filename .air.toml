# make dev: rebuilds and restarts the server on save
root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["templ generate"]
  cmd = "go build -o ./tmp/sablier-server ./cmd/sablier-server"
  entrypoint = ["./tmp/sablier-server"]
  include_ext = ["go", "templ", "sql"]
  exclude_dir = ["tmp", "bin", "website", "docs", "tools"]
  exclude_regex = ["_test\\.go$", "_templ\\.go$"]
  delay = 200

[misc]
  clean_on_exit = true
